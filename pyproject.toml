[project]
name = "researchpilot"
version = "0.3.1"
description = "Evidence-grounded academic research agent with claim verification and persistent local projects."
readme = "README.md"
authors = [
    { name = "renfeiwang" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "langgraph>=1,<2",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.26,<2",
    "pypdf>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.scripts]
researchpilot = "researchpilot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
